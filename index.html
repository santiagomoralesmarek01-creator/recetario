<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c8553d" />
  <meta name="description" content="Recetas caseras y del mundo, con modo cocina para ir tildando ingredientes y pasos." />
  <title>Recetario</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="icon" href="img/logo.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="img/logo-180.png" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="#/">
      <img src="img/logo.svg" alt="" width="36" height="36" />
      <span>Recetario</span>
    </a>
    <form class="buscador" id="buscador" role="search">
      <input id="busqueda" type="search" placeholder="Buscar receta o ingrediente…" autocomplete="off" aria-label="Buscar" />
      <button type="submit">Buscar</button>
    </form>
    <nav class="menu">
      <a class="boton boton-secundario" href="#/paises">🌎 Países</a>
      <button class="boton-secundario" id="sorpresa" type="button">🎲 Sorpresa</button>
      <span id="menu" class="menu-sesion"></span>
    </nav>
  </header>

  <main id="contenido" aria-live="polite"><p class="estado">Cargando…</p></main>

  <footer class="pie">
    Recetas del mundo e imágenes de ingredientes: <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a>.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
