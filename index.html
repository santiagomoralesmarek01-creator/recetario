<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c8553d" />
  <meta name="author" content="MrK" />
  <meta name="description" content="Recetas caseras y del mundo, con modo cocina para ir tildando ingredientes y pasos." />
  <title>Recetario</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="icon" href="img/logo.png" type="image/png" sizes="512x512" />
  <link rel="apple-touch-icon" href="img/logo-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-interior">
      <a class="marca" href="#/">
        <img src="img/logo.svg" alt="" width="34" height="34" />
        <span>Recetario</span>
      </a>
      <nav class="nav-principal" aria-label="Secciones">
        <a href="#/" data-ruta="">Inicio</a>
        <a href="#/que-tengo" data-ruta="que-tengo">¿Qué tengo en casa?</a>
        <a href="#/paises" data-ruta="paises pais">Países</a>
        <a href="#/comunidad" data-ruta="comunidad autor">Comunidad</a>
      </nav>
      <form class="buscador" id="buscador" role="search">
        <input id="busqueda" type="search" placeholder="Buscar receta o ingrediente" autocomplete="off" aria-label="Buscar" />
        <button type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
      </form>
      <div id="menu" class="menu"></div>
    </div>
  </header>

  <main id="contenido" aria-live="polite"><p class="estado">Cargando…</p></main>

  <footer class="pie">
    <p class="firma">Hecho por <strong>MrK</strong></p>
    <p>Recetas del mundo e imágenes de ingredientes: <a href="https://www.themealdb.com" target="_blank" rel="noopener">TheMealDB</a>.</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
